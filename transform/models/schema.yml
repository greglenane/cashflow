version: 2

models:
  - name: int_plaid_raw_batches
    description: Private Plaid raw batches read directly from the approved S3 prefix.
    columns:
      - name: source_file
        data_tests:
          - unique
          - not_null
      - name: batch
        data_tests:
          - not_null

  - name: int_plaid_current_accounts
    description: Latest sanitized account metadata from schema-version-2 raw batches.
    columns:
      - name: account_id
        data_tests:
          - unique
          - not_null
      - name: account_type
        data_tests:
          - accepted_values:
              arguments:
                values: [checking, credit]

  - name: int_plaid_current_transactions
    description: Current posted and pending Plaid records after replaying add, modify, and remove events.
    columns:
      - name: transaction_id
        data_tests:
          - unique
          - not_null
      - name: account_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_plaid_current_accounts')
                field: account_id

  - name: stg_plaid_accounts
    description: Synthetic Plaid account metadata normalized to non-sensitive internal identifiers.
    columns:
      - name: account_id
        data_tests:
          - unique
          - not_null
      - name: account_type
        data_tests:
          - accepted_values:
              arguments:
                values: [checking, credit]

  - name: stg_plaid_transactions
    description: Posted Plaid transactions with canonical signs and deterministic deduplication.
    columns:
      - name: transaction_id
        data_tests:
          - unique
          - not_null
      - name: account_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_plaid_accounts')
                field: account_id
      - name: amount
        data_tests:
          - not_null

  - name: int_transactions_classified
    description: Explainable base flow and category classification before transfer pairing.
    columns:
      - name: transaction_id
        data_tests:
          - unique
          - not_null
      - name: base_flow_type
        data_tests:
          - accepted_values:
              arguments:
                values: [income, expense, transfer, card_payment, refund, excluded]
      - name: category
        data_tests:
          - not_null

  - name: int_transfer_matches
    description: Mutual-best transfer and card-payment pair assignments within a three-day tolerance.
    columns:
      - name: transaction_id
        data_tests:
          - unique
          - not_null
      - name: transfer_match_id
        data_tests:
          - not_null
      - name: match_flow_type
        data_tests:
          - accepted_values:
              arguments:
                values: [transfer, card_payment]

  - name: fct_transactions
    description: Canonical transaction fact table used by all cashflow metrics.
    columns:
      - name: transaction_id
        data_tests:
          - unique
          - not_null
      - name: account_id
        data_tests:
          - not_null
      - name: transaction_date
        data_tests:
          - not_null
      - name: amount
        data_tests:
          - not_null
      - name: flow_type
        data_tests:
          - accepted_values:
              arguments:
                values: [income, expense, transfer, card_payment, refund, excluded]
      - name: source
        data_tests:
          - accepted_values:
              arguments:
                values: [plaid]

  - name: fct_monthly_cashflow
    description: Monthly income, net spending, cashflow, and savings-rate metrics.
    columns:
      - name: month_start
        data_tests:
          - unique
          - not_null
      - name: income
        data_tests:
          - not_null
      - name: spending
        data_tests:
          - not_null
      - name: net_cashflow
        data_tests:
          - not_null

  - name: fct_monthly_spending_by_category
    description: Net expense and refund totals by month and user-facing category.
    data_tests:
      - unique:
          arguments:
            column_name: "month_start || '|' || category"
    columns:
      - name: month_start
        data_tests:
          - not_null
      - name: category
        data_tests:
          - not_null
      - name: spending
        data_tests:
          - not_null

  - name: fct_cashflow_periods
    description: Current MTD and matched-day prior-month and prior-year cashflow periods.
    columns:
      - name: period_name
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: [current_mtd, prior_month_comparable, prior_year_comparable]
      - name: data_cutoff_date
        data_tests:
          - not_null
      - name: period_start
        data_tests:
          - not_null
      - name: period_end
        data_tests:
          - not_null

  - name: fct_mtd_comparison
    description: One-row matched-day MTD spending and income comparison for headline metrics.
    columns:
      - name: data_cutoff_date
        data_tests:
          - unique
          - not_null
      - name: current_spending
        data_tests:
          - not_null
      - name: prior_month_spending
        data_tests:
          - not_null
      - name: prior_year_spending
        data_tests:
          - not_null

  - name: fct_recurring_purchases
    description: Explainable recurring expenses with cadence, confidence, and predicted next charge.
    columns:
      - name: recurring_id
        data_tests:
          - unique
          - not_null
      - name: merchant_normalized
        data_tests:
          - not_null
      - name: cadence
        data_tests:
          - accepted_values:
              arguments:
                values: [weekly, monthly, quarterly, annual]
      - name: confidence
        data_tests:
          - not_null
      - name: detection_reason
        data_tests:
          - not_null

  - name: fct_outlier_purchases
    description: Expense outliers with robust category baselines and explicit flag reasons.
    columns:
      - name: transaction_id
        data_tests:
          - unique
          - not_null
      - name: amount_absolute
        data_tests:
          - not_null
      - name: flag_method
        data_tests:
          - accepted_values:
              arguments:
                values: [category_mad, zero_mad_fallback, limited_history_threshold]
      - name: detection_reason
        data_tests:
          - not_null
